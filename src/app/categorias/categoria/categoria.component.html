<div class="p-6 max-w-lg mx-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2xl font-semibold text-gray-700 mb-4">Nova Categoria</h2>

  <form id="categoriaForm" [formGroup]="camposForm" (ngSubmit)="salvar()">


    <div class="mb-4">
      <label for="" class="block text-gray-600 font-medium mb-2"></label>
      <input type="text" formControlName="nome" name="nome" placeholder="Ex. Restaurantes, Praia, Shopping"
        class="w-full p-3 border borer-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400" required />
      <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('nome')">Campo Obrigátorio</span>
    </div>

    <!-- Campo Descrição -->
    <div class="mb-4">
      <label for="" class="block text-gray-600 font-medium mb-2">Descrição</label>

      <textarea row="4" formControlName="descricao" name="descricao" placeholder="Ex. Restaurantes, Praia, Shopping"
        class="w-full p-3 border borer-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400"
        required></textarea>
      <span class="text-red-500 text-sm" *ngIf="isCampoInvalido('descricao')">Campo Obrigátorio</span>
    </div>

    <button type="submit"
      class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700">Cadastrar</button>
  </form>
</div>
